name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Validate JSON
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(**/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "No JSON files to validate."; exit 0; fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            jq empty "$f"
          done

      - name: Validate YAML
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(**/*.yml **/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "No YAML files to validate."; exit 0; fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            yq eval 'true' "$f" > /dev/null
          done

      - name: Shellcheck hook scripts
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(**/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "No shell scripts to check."; exit 0; fi
          shellcheck "${files[@]}"

  tests:
    name: Python tests (${{ matrix.os }})
    # Windows is in the matrix because the mnemosyne MCP server once hung on every tool call
    # there and nowhere else; tests/test_mnemosyne_mcp_stdio.py is the round trip that sees it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      # The MCP stdio test skips without the optional `mcp` package; here a missing package fails.
      MNEMOSYNE_REQUIRE_MCP: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Blocking. This repo is public, so an absolute path from a contributor's
      # machine is a leak the moment it merges. The guard is shape-based and
      # holds no secret terms — see scripts/check_identifiers.py, which also
      # documents what it deliberately cannot see.
      - name: "Identifier guard: unit tests"
        run: python -m unittest discover -s scripts -p "test_check_identifiers.py" -t scripts -v

      - name: "Identifier guard: scan tracked files"
        run: python scripts/check_identifiers.py

      # Blocking. A Markdown link or backticked repo path that no longer resolves
      # is drift a machine can see; see scripts/check_doc_pointers.py for what
      # counts as a pointer and what is deliberately skipped.
      - name: "Doc pointers: unit tests"
        run: python -m unittest discover -s scripts -p "test_check_doc_pointers.py" -t scripts -v

      - name: "Doc pointers: scan Markdown"
        run: python scripts/check_doc_pointers.py

      - name: Install the MCP server's optional dependency (mnemosyne)
        run: python -m pip install --quiet "mcp>=1.2,<2"

      - name: Run unittest suite
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke-import the MCP server (mnemosyne)
        run: |
          PYTHONPATH="mnemosyne/src" \
            python -c "import mnemosyne.mcp_server; print('MCP server import OK')"
